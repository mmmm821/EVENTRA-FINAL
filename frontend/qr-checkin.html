<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFD500">
<meta name="description" content="EVENTRA — discover events, book tickets and manage digital QR tickets.">
<title>QR Check-in — EVENTRA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar" class="navbar"></div>

<main class="container" style="max-width:560px;padding-top:30px;">
  <span class="badge badge-cyan">Organizer / Admin</span>
  <h2 style="margin-top:10px;font-size:24px;">QR Check-in &amp; Verification</h2>
  <p style="color:var(--muted);margin-top:6px;">Scan a ticket QR code or type its ID to verify and allow entry.</p>

  <div class="card card-pad" style="margin-top:20px;">
    <div class="form-group">
      <label>Ticket ID or Scanned QR Value</label>
      <input class="form-control" id="verifyInput" placeholder="Enter Ticket ID or paste scanned QR value">
    </div>
    <button class="btn btn-green btn-block" id="verifyBtn">Verify Ticket →</button>
  </div>

  <div class="card card-pad hidden" id="resultBox" style="margin-top:20px;"></div>
</main>

<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/nav.js"></script>
<script src="js/qr-checkin.js"></script>
</body>
</html>
