<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFD500">
<meta name="description" content="EVENTRA — discover events, book tickets and manage digital QR tickets.">
<title>Booking Flow — EVENTRA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar" class="navbar"></div>

<main class="container" style="max-width:900px;padding-top:30px;">
  <h2 style="font-size:24px;">Booking Flow</h2>

  <div class="two-col" style="margin-top:20px;align-items:start;">
    <div class="card card-pad" id="orderSummary">
      <!-- injected: event + ticket summary -->
    </div>

    <div class="card card-pad">
      <div class="flow-steps" id="flowSteps"></div>
    </div>
  </div>

  <div class="card card-pad hidden" id="confirmBox" style="margin-top:20px;">
    <div class="confirm-box">
      <div class="confirm-tick">✓</div>
      <h3 style="font-size:20px;">Booking Confirmed!</h3>
      <p style="color:var(--muted);margin-top:8px;">Your ticket has been booked successfully.</p>
      <a class="btn btn-yellow" style="margin-top:18px;" href="my-tickets.html">View My Ticket →</a>
    </div>
  </div>
</main>

<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/nav.js"></script>
<script src="js/booking.js"></script>
</body>
</html>
