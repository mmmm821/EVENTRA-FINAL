<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFD500">
<meta name="description" content="EVENTRA — discover events, book tickets and manage digital QR tickets.">
<title>EVENTRA — Discover. Book. Attend.</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar" class="navbar"></div>

<main class="container">

  <section class="hero">
    <span class="badge badge-pink">Verified Event Platform</span>
    <h1 class="hero-title" style="margin-top:14px;">DISCOVER.<br>BOOK. <span class="accent">ATTEND.</span></h1>
    <p style="max-width:480px;color:var(--muted);font-weight:500;">
      Find the best events, book your tickets, pay securely and get your digital QR ticket.
    </p>

    <div class="search-row">
      <input id="searchInput" class="search-input" type="text" placeholder="Search events, venues, organizers...">
      <button class="btn btn-pink" id="searchBtn">Search</button>
    </div>

    <div class="filter-pills" id="categoryPills"></div>
  </section>

  <div class="section-title-row">
    <h2 style="font-size:22px;">Featured Events</h2>
    <a href="#" id="viewAllBtn" style="font-weight:700;font-size:13px;text-transform:uppercase;">View All →</a>
  </div>

  <div class="events-grid" id="eventsGrid">
    <!-- injected by home.js -->
  </div>

  <div style="text-align:center;margin:30px 0;">
    <button class="btn" id="loadMoreBtn" style="display:none;">Load More</button>
  </div>

</main>

<footer class="footer">EVENTRA — Full-Stack Event Discovery &amp; Ticket Booking Platform</footer>
<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/nav.js"></script>
<script src="js/cards.js"></script>
<script src="js/home.js"></script>
</body>
</html>
